version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - rm -rf node_modules
        - npm ci --include=optional --force
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
